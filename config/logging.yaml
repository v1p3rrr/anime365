# Уровни логирования.
#
# Файл монтируется в контейнер как /config/logging.yaml, поэтому правится на
# живом сервере без пересборки образа. Читается при старте приложения:
# после правки нужен `docker compose restart anime365-downloader`.
#
# Разово, не трогая файл, то же самое умеют переменные окружения:
#   A365_LOG_LEVEL=DEBUG
#   A365_LOG_LEVELS=app.services.matcher=DEBUG,app.access=WARNING
# Они перекрывают всё, что написано здесь.
#
# Уровни: DEBUG, INFO, WARNING, ERROR, CRITICAL.
#
# ⚠️ Здесь задаются ТОЛЬКО уровни. Обработчик и формат вывода настраиваются в
# коде намеренно: к ним прицеплен фильтр, вырезающий из сообщений access_token.
# Токен Anime365 бессрочен, и попадание его в лог равносильно утечке, поэтому
# заменить обработчик через конфиг нельзя.

# Общий уровень для всего приложения.
root: INFO

# Точечно по модулям. Имя модуля — третье поле в строке лога.
loggers:
  # Строки доступа со временем ответа: «GET /api/catalog/ids 200 за 43 мс».
  # WARNING оставит только медленные запросы (порог A365_SLOW_REQUEST_MS,
  # по умолчанию 1000 мс), DEBUG добавит проверки здоровья контейнера.
  app.access: INFO

  # Самые говорливые места — включать по необходимости:
  # app.services.matcher: DEBUG          # почему папка села на этот тайтл
  # app.services.library_scan: DEBUG     # обход диска, пропуски по .ignore
  # app.services.download_queue: DEBUG   # очередь загрузок и постобработка
  # app.services.autodownload: DEBUG     # подбор субтитров под правила

  # Логирует полные URL, а в них уходит access_token. Ниже WARNING поднимать
  # не стоит — фильтр секретов справится, но смысла в этих строках мало.
  httpx: WARNING
