services:
  anime365-downloader:
    build: .
    image: anime365-downloader:0.1.0
    container_name: anime365-downloader
    restart: unless-stopped

    ports:
      # Слушаем только localhost: наружу выставлять напрямую нельзя — через UI доступен
      # премиум-токен и запись в файловую систему. Наружу — только через Nginx с
      # авторизацией либо через VPN. Для доступа из локалки замените на 0.0.0.0:8080:8080.
      - "127.0.0.1:8080:8080"

    environment:
      # Прокси для всех исходящих запросов к Anime365 — каталог, embed, скачивание
      # и проксирование видео в плеер. Пусто, если переменная не задана на хосте:
      # так один и тот же compose работает и с VPN, и без него.
      #
      # HTTPS_PROXY достаточно: весь трафик к сайту идёт по https. ALL_PROXY нужен
      # для SOCKS5 (`socks5://host:1080`), в том числе socks5h — с разрешением имён
      # на стороне прокси, что для обхода блокировок по DNS обычно и требуется.
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}

      # --- Настройки приложения ---
      #
      # Перечислены здесь явно, а значения берутся из `.env`. Смысл в том,
      # чтобы список того, чем вообще управляют, был виден в одном месте и
      # лежал в репозитории, а значения — нет: `.env` в .gitignore,
      # `docker-compose.yml` коммитится.
      #
      # ⚠️⚠️ ВСЕ ЗНАЧЕНИЯ ДОЛЖНЫ ЛЕЖАТЬ В `.env` — том файле, что рядом с этим
      # compose. НЕ в другом файле, подключённом через `env_file:`.
      #
      # Почему это важно, и почему `env_file:` здесь больше нет. Подстановка
      # `${VAR}` выполняется docker compose при разборе файла и берёт значения
      # только из окружения оболочки и из `.env`. Файл из `env_file:` для неё
      # не существует. При этом `environment:` имеет приоритет над `env_file:`,
      # поэтому строка `- A365_ACCESS_TOKEN=${A365_ACCESS_TOKEN:-}` подставляла
      # ПУСТУЮ строку и затирала значение из подключённого файла.
      #
      # Проверено на живом compose: со значениями в отдельном `.env.app`
      # приложение получало `A365_ACCESS_TOKEN=''` и `A365_JELLYFIN_URL=''`.
      # Пустое приложение трактует как «не задано» и берёт значение по
      # умолчанию — снаружи это выглядит как «настройки из .env не работают, а
      # то, что работает, просто совпало с дефолтом».
      #
      # Голая форма `- A365_ACCESS_TOKEN` (без «=») тоже не спасает: проверено,
      # она точно так же гасит значение из `env_file:`.
      #
      # `${VAR:-}` — «взять из окружения или `.env`, иначе пустая строка».
      # Пустое значение приложение трактует как «не задано» и берёт значение
      # по умолчанию из реестра настроек, поэтому лишние строки ничего не
      # ломают: можно заполнить в `.env` только нужное.
      #
      # Приоритет: значение по умолчанию в коде < эта переменная < правка из UI.
      # Помеченные «секрет» в интерфейс не отдаются — только маской.
      #
      # ⚠️ Список порождается из реестра настроек (backend/app/core/
      # settings_registry.py). Добавили настройку — обновите и здесь;
      # расхождение ловит tests/test_compose_env.py.

      # --- Anime365 ---
      - A365_BASE_URL=${A365_BASE_URL:-}
      - A365_MIRRORS=${A365_MIRRORS:-}
      - A365_ACCESS_TOKEN=${A365_ACCESS_TOKEN:-}  # секрет
      - A365_USER_AGENT=${A365_USER_AGENT:-}
      - A365_REQUEST_RATE_LIMIT=${A365_REQUEST_RATE_LIMIT:-}

      # --- Пути внутри контейнера ---
      - A365_SERIES_ROOT=${A365_SERIES_ROOT:-}
      - A365_MOVIES_ROOT=${A365_MOVIES_ROOT:-}
      - A365_AUDIO_ROOT=${A365_AUDIO_ROOT:-}
      - A365_DOWNLOAD_TMP=${A365_DOWNLOAD_TMP:-}

      # --- Загрузки ---
      - A365_MAX_CONCURRENT_DOWNLOADS=${A365_MAX_CONCURRENT_DOWNLOADS:-}
      - A365_PREFERRED_HEIGHT=${A365_PREFERRED_HEIGHT:-}
      - A365_MAX_ATTEMPTS=${A365_MAX_ATTEMPTS:-}
      - A365_RETRY_BACKOFF_BASE=${A365_RETRY_BACKOFF_BASE:-}
      - A365_MIN_FREE_SPACE_GB=${A365_MIN_FREE_SPACE_GB:-}
      - A365_SPEED_LIMIT_KBPS=${A365_SPEED_LIMIT_KBPS:-}
      - A365_TRY_DIRECT_CDN=${A365_TRY_DIRECT_CDN:-}

      # --- Расписания ---
      - A365_CATALOG_REFRESH_HOURS=${A365_CATALOG_REFRESH_HOURS:-}
      - A365_CATALOG_FULL_REFRESH_HOURS=${A365_CATALOG_FULL_REFRESH_HOURS:-}
      - A365_LIBRARY_SCAN_HOURS=${A365_LIBRARY_SCAN_HOURS:-}
      - A365_WATCH_FILESYSTEM=${A365_WATCH_FILESYSTEM:-}
      - A365_WATCH_DEBOUNCE_SECONDS=${A365_WATCH_DEBOUNCE_SECONDS:-}

      # --- Сопоставление папок с каталогом ---
      - A365_FUZZY_AUTO_THRESHOLD=${A365_FUZZY_AUTO_THRESHOLD:-}
      - A365_FUZZY_SUGGEST_THRESHOLD=${A365_FUZZY_SUGGEST_THRESHOLD:-}

      # --- Права на создаваемые файлы ---
      - A365_PUID=${A365_PUID:-}
      - A365_PGID=${A365_PGID:-}
      - A365_UMASK=${A365_UMASK:-}

      # --- Безопасность ---
      - A365_UI_PASSWORD=${A365_UI_PASSWORD:-}  # секрет

      # --- Дополнительно ---
      - A365_ENABLE_FFPROBE=${A365_ENABLE_FFPROBE:-}
      - A365_ENABLE_JELLYFIN=${A365_ENABLE_JELLYFIN:-}
      - A365_JELLYFIN_URL=${A365_JELLYFIN_URL:-}
      - A365_JELLYFIN_PUBLIC_URL=${A365_JELLYFIN_PUBLIC_URL:-}
      - A365_JELLYFIN_API_KEY=${A365_JELLYFIN_API_KEY:-}  # секрет

      # --- Только через окружение: в интерфейсе этих полей нет ---
      - A365_TRANSLATION_SCAN_HOURS=${A365_TRANSLATION_SCAN_HOURS:-}
      - A365_TRANSLATION_SCAN_RPM=${A365_TRANSLATION_SCAN_RPM:-}
      - A365_TRANSLATION_SCAN_SCOPE=${A365_TRANSLATION_SCAN_SCOPE:-}

    volumes:
      - ./config:/config
      - ./data:/data
      # ─── Медиа: ОДНО монтирование на всё ────────────────────────────────
      # Библиотеки и папка загрузок лежат внутри него подпапками. Это не
      # вопрос вкуса: готовый файл переезжает из загрузок в библиотеку
      # переименованием только внутри одного монтирования — мгновенно и
      # независимо от размера. Разнесённые по отдельным томам папки дают
      # копирование 230 МБ на каждую серию.
      #
      # Проверено экспериментом: у двух отдельных `-v` с одной и той же
      # хостовой папки st_dev совпадает, но os.rename падает с EXDEV — ядро
      # сравнивает монтирования (vfsmount), а не файловые системы. Внутри
      # одного тома то же перемещение отрабатывает за 5 мс.
      #
      # rw нужен, потому что мы кладём сюда скачанные файлы.
      #
      # Внутренняя раскладка (задаётся путями в .env, менять можно там):
      #   /mnt/media/anime/library        -> A365_SERIES_ROOT=/media/anime/library
      #   /mnt/media/anime_movies/library -> A365_MOVIES_ROOT=/media/anime_movies/library
      #   /mnt/media/anime_audio          -> A365_AUDIO_ROOT=/media/anime_audio
      #   /mnt/media/.a365-tmp            -> A365_DOWNLOAD_TMP=/media/.a365-tmp
      #
      # ⚠️ Оговорка: если anime, anime_movies и anime_audio на хосте — разные
      # диски, примонтированные под /mnt/media, docker их вложенные точки
      # монтирования внутрь по умолчанию не пробрасывает. Тогда добавьте
      # `bind-propagation: rslave` или монтируйте их отдельно, понимая, что
      # мгновенным перемещение останется только для того корня, что делит
      # монтирование с папкой загрузок.
      - /mnt/media:/media

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Корневая ФС контейнера только для чтения: даже при выполнении произвольного
    # кода внутри его негде закрепить. Писать разрешено ровно туда, где смонтированы
    # тома, плюс /tmp — Python и httpx туда изредка пишут.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

    # Ограничения памяти: приложение рассчитано на ~200 МБ, запас на пики загрузок.
    deploy:
      resources:
        limits:
          memory: 512M

    healthcheck:
      # На Python, а не curl: curl из образа убран намеренно — полноценный
      # загрузчик внутри контейнера это готовый способ утащить что угодно
      # извне. Python там есть в любом случае.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/api/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Раскомментируйте, если контейнер нужно положить в одну сеть с Jellyfin.
# networks:
#   default:
#     name: media
#     external: true
