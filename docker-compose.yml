services:
  anime365-downloader:
    build: .
    image: anime365-downloader:0.1.0
    container_name: anime365-downloader
    restart: unless-stopped

    ports:
      # Слушаем только localhost: наружу выставлять напрямую нельзя — через UI доступен
      # премиум-токен и запись в файловую систему. Наружу — только через Nginx с
      # авторизацией либо через VPN. Для доступа из локалки замените на 0.0.0.0:8080:8080.
      - "127.0.0.1:8080:8080"

    env_file:
      # Файл с настройками приложения. Меняйте путь здесь, если он у вас
      # называется иначе или их несколько — можно перечислить списком.
      #
      # Не обязателен: у всех настроек есть значения по умолчанию, а задать их
      # можно и из UI. Без required:false свежий клон падал бы на «.env not
      # found» ещё до старта контейнера.
      - path: .env.app
        required: false

    environment:
      # Здесь остаётся только то, что собирается из других переменных, — им
      # подстановка нужна, и берётся она из `.env` рядом с этим файлом.
      #
      # Прокси для всех исходящих запросов к Anime365 — каталог, embed, скачивание
      # и проксирование видео в плеер. Пусто, если переменная не задана на хосте:
      # так один и тот же compose работает и с VPN, и без него.
      #
      # HTTPS_PROXY достаточно: весь трафик к сайту идёт по https. ALL_PROXY нужен
      # для SOCKS5 (`socks5://host:1080`), в том числе socks5h — с разрешением имён
      # на стороне прокси, что для обхода блокировок по DNS обычно и требуется.
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}

      # --- Настройки приложения ---
      #
      # Их здесь НЕТ намеренно. Все они читаются из файла, указанного в
      # `env_file:` выше, — по умолчанию `.env.app`. Хотите другой файл или
      # несколько — поменяйте там путь, менять этот compose не придётся.
      #
      # ⚠️ Почему список переехал из compose в файл. Раньше здесь стояли строки
      # вида `- A365_ACCESS_TOKEN=${A365_ACCESS_TOKEN:-}`, чтобы перечень был
      # виден в одном месте. Это молча ломало всё: подстановка `${VAR}`
      # выполняется docker compose при разборе файла и берёт значения только из
      # окружения оболочки и из `.env`; файла из `env_file:` для неё не
      # существует. А `environment:` имеет приоритет над `env_file:` — поэтому
      # значения из подключённого файла затирались пустой строкой, приложение
      # считало их незаданными и брало значения по умолчанию.
      #
      # Проверено на живом compose, включая голую форму `- A365_ACCESS_TOKEN`
      # без «=»: она гасит `env_file:` точно так же.
      #
      # Полный список переменных с пояснениями — в `.env.example` (он же
      # шаблон для `.env.app`) и в `docs/admin.md`. Приложение при старте
      # пишет в лог, сколько настроек приняло из окружения и какие именно,
      # так что проверить, доехали ли они, можно одной строкой в `docker logs`.

    volumes:
      - ./config:/config
      - ./data:/data
      # ─── Медиа: ОДНО монтирование на всё ────────────────────────────────
      # Библиотеки и папка загрузок лежат внутри него подпапками. Это не
      # вопрос вкуса: готовый файл переезжает из загрузок в библиотеку
      # переименованием только внутри одного монтирования — мгновенно и
      # независимо от размера. Разнесённые по отдельным томам папки дают
      # копирование 230 МБ на каждую серию.
      #
      # Проверено экспериментом: у двух отдельных `-v` с одной и той же
      # хостовой папки st_dev совпадает, но os.rename падает с EXDEV — ядро
      # сравнивает монтирования (vfsmount), а не файловые системы. Внутри
      # одного тома то же перемещение отрабатывает за 5 мс.
      #
      # rw нужен, потому что мы кладём сюда скачанные файлы.
      #
      # Внутренняя раскладка (задаётся путями в .env, менять можно там):
      #   /mnt/media/anime/library        -> A365_SERIES_ROOT=/media/anime/library
      #   /mnt/media/anime_movies/library -> A365_MOVIES_ROOT=/media/anime_movies/library
      #   /mnt/media/anime_audio          -> A365_AUDIO_ROOT=/media/anime_audio
      #   /mnt/media/.a365-tmp            -> A365_DOWNLOAD_TMP=/media/.a365-tmp
      #
      # ⚠️ Оговорка: если anime, anime_movies и anime_audio на хосте — разные
      # диски, примонтированные под /mnt/media, docker их вложенные точки
      # монтирования внутрь по умолчанию не пробрасывает. Тогда добавьте
      # `bind-propagation: rslave` или монтируйте их отдельно, понимая, что
      # мгновенным перемещение останется только для того корня, что делит
      # монтирование с папкой загрузок.
      - /mnt/media:/media

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Корневая ФС контейнера только для чтения: даже при выполнении произвольного
    # кода внутри его негде закрепить. Писать разрешено ровно туда, где смонтированы
    # тома, плюс /tmp — Python и httpx туда изредка пишут.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

    # Ограничения памяти: приложение рассчитано на ~200 МБ, запас на пики загрузок.
    deploy:
      resources:
        limits:
          memory: 512M

    healthcheck:
      # На Python, а не curl: curl из образа убран намеренно — полноценный
      # загрузчик внутри контейнера это готовый способ утащить что угодно
      # извне. Python там есть в любом случае.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/api/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Раскомментируйте, если контейнер нужно положить в одну сеть с Jellyfin.
# networks:
#   default:
#     name: media
#     external: true
