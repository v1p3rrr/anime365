services:
  anime365-downloader:
    build: .
    image: anime365-downloader:0.1.0
    container_name: anime365-downloader
    restart: unless-stopped

    ports:
      # Слушаем только localhost: наружу выставлять напрямую нельзя — через UI доступен
      # премиум-токен и запись в файловую систему. Наружу — только через Nginx с
      # авторизацией либо через VPN. Для доступа из локалки замените на 0.0.0.0:8080:8080.
      - "127.0.0.1:8080:8080"

    env_file:
      # Не обязателен: у всех настроек есть значения по умолчанию, а задать их
      # можно и из UI. Без required:false свежий клон падал бы на «.env not found»
      # ещё до старта контейнера.
      - path: .env
        required: false

    environment:
      # Прокси для всех исходящих запросов к Anime365 — каталог, embed, скачивание
      # и проксирование видео в плеер. Пусто, если переменная не задана на хосте:
      # так один и тот же compose работает и с VPN, и без него.
      #
      # HTTPS_PROXY достаточно: весь трафик к сайту идёт по https. ALL_PROXY нужен
      # для SOCKS5 (`socks5://host:1080`), в том числе socks5h — с разрешением имён
      # на стороне прокси, что для обхода блокировок по DNS обычно и требуется.
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}

    volumes:
      - ./config:/config
      - ./data:/data
      # Медиа с другого диска. Пути должны совпадать с A365_SERIES_ROOT / A365_MOVIES_ROOT.
      # rw нужен, потому что мы кладём сюда скачанные файлы.
      - /mnt/media/anime/library:/media/anime
      - /mnt/media/anime_movies/library:/media/anime_movies
      # Фонотека: извлечённые звуковые дорожки. Корень отдельный, потому что
      # Jellyfin индексировал бы их в библиотеке как видео без картинки.
      # Путь должен совпадать с A365_AUDIO_ROOT.
      - /mnt/media/anime_audio:/media/audio

      # ─── Про мгновенное перемещение готовых файлов ───────────────────────
      # По умолчанию A365_DOWNLOAD_TMP=/data/tmp, то есть загрузки лежат в томе
      # с базой, а библиотека — в другом томе. Перемещение между ними идёт
      # копированием байт: 230 МБ на серию реально читаются и пишутся заново.
      #
      # Решает НЕ диск и даже не файловая система, а монтирование. Проверено:
      # у двух отдельных `-v` с одной и той же хостовой папки `st_dev` общий,
      # но os.rename падает с EXDEV, потому что ядро сравнивает монтирования.
      #
      # Чтобы перемещение стало переименованием, папка загрузок должна быть
      # ВНУТРИ того же монтирования, что и библиотека. Если /mnt/media — одна
      # файловая система, вместо трёх томов выше монтируйте общий корень:
      #
      #   - /mnt/media:/media
      #
      # и задайте пути внутри него:
      #
      #   A365_SERIES_ROOT=/media/anime/library
      #   A365_MOVIES_ROOT=/media/anime_movies/library
      #   A365_AUDIO_ROOT=/media/anime_audio
      #   A365_DOWNLOAD_TMP=/media/.a365-tmp
      #
      # Оговорка: если anime, anime_movies и anime_audio на хосте — разные
      # диски, примонтированные под /mnt/media, docker их вложенные точки
      # монтирования по умолчанию внутрь не пробрасывает. Тогда общий корень
      # не поможет, и мгновенным перемещение будет только для той библиотеки,
      # что делит монтирование с папкой загрузок.

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Корневая ФС контейнера только для чтения: даже при выполнении произвольного
    # кода внутри его негде закрепить. Писать разрешено ровно туда, где смонтированы
    # тома, плюс /tmp — Python и httpx туда изредка пишут.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

    # Ограничения памяти: приложение рассчитано на ~200 МБ, запас на пики загрузок.
    deploy:
      resources:
        limits:
          memory: 512M

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Раскомментируйте, если контейнер нужно положить в одну сеть с Jellyfin.
# networks:
#   default:
#     name: media
#     external: true
