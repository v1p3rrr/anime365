version: 2

# Действия в ci.yml прибиты к коммитам, а не к тегам: тег можно передвинуть, и
# `@v4` завтра окажется другим кодом с теми же правами. Обратная сторона — сами
# по себе они больше не обновляются никогда, поэтому обновляет их Dependabot.
#
# ⚠️ Настройки ниже — про то, чтобы он не превращался в шум. Первый же запуск с
# умолчаниями завёл **одиннадцать** пул-реквестов разом: зависимости в проекте
# давно не трогали, а каждая обновляется отдельной веткой, и каждая тянет за
# собой полный прогон CI. Поэтому:
#
#  * **группировка** — все обновления одной экосистемы приезжают ОДНИМ
#    пул-реквестом. Одна ветка, один прогон, один разбор;
#  * **раз в месяц**, а не в неделю. Обновления безопасности приходят отдельно и
#    расписания не ждут — частый опрос покупает только шум;
#  * **мажорные прыжки базовых образов игнорируются** (см. ниже).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 2

  # Базовые образы Dockerfile.
  #
  # ⚠️ Оба тега уже плавающие: `python:3.12-slim` сам подтягивает 3.12.x, а
  # `node:22-alpine` — 22.x. То есть исправления и так приезжают при каждой
  # пересборке, и Dependabot тут может предложить только смену ветки языка —
  # ровно то, чего мы не хотим случайно.
  #
  # У python игнорируем и минорную: 3.12 → 3.13 меняет интерпретатор, а проект
  # объявлен как `requires-python = ">=3.12"` с `target-version = "py312"`.
  # Переход на новую версию языка — отдельная задача с прогоном тестов на ней,
  # а не автоматический пул-реквест.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: node
        update-types:
          - version-update:semver-major
    groups:
      base-images:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    ignore:
      # ⚠️ Мажорные обновления не предлагаем. Первый же сгруппированный
      # пул-реквест это доказал: он тянул typescript 5.7 сразу в 7.0, а
      # typescript-eslint объявляет peer-диапазон `>=4.8.4 <6.1.0` — группа
      # оказалась несовместима сама с собой, и `npm ci` отказался её ставить.
      # Смена мажора — работа с чтением changelog и правкой кода, а не кнопка
      # «слить». Обратная сторона честная: если исправление уязвимости выйдет
      # только в новом мажоре, пул-реквеста не будет — придёт оповещение во
      # вкладке Security, и обновлять надо руками.
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      frontend:
        patterns: ['*']
    open-pull-requests-limit: 2

  # Раньше здесь стояло предупреждение: список зависимостей продублирован в
  # Dockerfile, поэтому пул-реквесты бота падали на `test_dockerfile_deps` и
  # требовали ручной правки. Дубля больше нет — образ ставит зависимости прямо
  # из pyproject.toml (D-167), и обновления проходят без ручного вмешательства.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    ignore:
      # ⚠️ Мажорные обновления не предлагаем — по той же причине, что и у
      # фронтенда: мажор меняет поведение, а не чинит его, и приезжать он должен
      # осознанно. Тут это особенно чувствительно: sqlalchemy и fastapi держат
      # половину кода, а пины в pyproject снабжены комментариями про конкретные
      # CVE — их надо перечитывать руками, а не переписывать ботом. Обратная
      # сторона честная: если исправление уязвимости выйдет только в новом
      # мажоре, пул-реквеста не будет — придёт оповещение во вкладке Security.
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      backend:
        patterns: ['*']
    open-pull-requests-limit: 2
