version: 2

# Действия в ci.yml прибиты к коммитам, а не к тегам: тег можно передвинуть, и
# `@v4` завтра окажется другим кодом с теми же правами. Обратная сторона — сами
# по себе они больше не обновляются никогда, поэтому обновляет их Dependabot:
# он поднимает коммит и в комментарии рядом пишет новую версию.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Базовые образы Dockerfile: python:3.12-slim и node:22-alpine.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # ⚠️ Список зависимостей продублирован в Dockerfile ради кэша слоёв, а
  # Dependabot правит только pyproject.toml. Его пул-реквесты будут падать на
  # `tests/test_dockerfile_deps.py` до тех пор, пока список в Dockerfile не
  # поправят руками. Это не поломка, а именно то, ради чего тест написан.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
