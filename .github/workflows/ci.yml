name: CI

# Тесты — на каждый пул-реквест в main и на каждый пуш в main.
# Публикация образа — ТОЛЬКО на пуш. У прогона по пул-реквесту доступа к
# секретам нет и быть не должно: код в PR ещё никем не прочитан, а токен
# Docker Hub даёт право перезаписать образ, который потом поедет на сервер.
#
# Разделение доведено до конца: образ собирается в работе БЕЗ токена и уезжает
# дальше архивом. Работа, у которой токен есть, репозиторий даже не выкачивает —
# она разжимает готовый архив и толкает его в реестр (D-163).
#
# Архив едет через кэш Actions, а не через артефакты: у бесплатной
# организации хранилище Actions — 500 МБ в месяц (в гигабайт-часах), и оно
# кончалось на второй неделе: архивы образа по 186 МБ плюс кэш слоёв
# `mode=max` под гигабайт держали ~0,7 ГБ круглые сутки. Артефакт при
# исчерпании не загружается вовсе (публикация встаёт до следующего месяца),
# кэш — грузится; свою запись работа `cleanup` стирает сразу после
# публикации, а слоёв кэшируется ровно итоговый образ (D-213).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Права токена по умолчанию — только чтение репозитория. Работам, которым нужно
# больше, права выдаются поимённо и в минимальном объёме.
permissions:
  contents: read

# Пуш за пушем: предыдущий прогон отменяется. Иначе два прогона могут добраться
# до публикации вразнобой, и в `latest` окажется не последний коммит.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Тесты бэкенда
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Токен не остаётся в .git/config: дальше по шагам он не нужен, а
          # любой из них — от npm-хука до тестов — мог бы им воспользоваться.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Зависимости
        run: |
          # Единственный источник версий — pyproject.toml, тот же, что у образа.
          # Отдельного requirements.txt нет намеренно: он бы разошёлся, как уже
          # расходился список в Dockerfile (см. tests/test_dockerfile_deps.py).
          python - > "$RUNNER_TEMP/requirements-ci.txt" <<'PY'
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("backend/pyproject.toml").read_text(encoding="utf-8"))
          deps = list(data["project"]["dependencies"])
          # Из dev-зависимостей берём только прогон тестов: ruff и mypy пока не
          # гейт (D-159), а pip-audit ходит в сеть на каждый запуск.
          deps += [d for d in data["project"]["optional-dependencies"]["dev"] if d.startswith("pytest")]
          print("\n".join(deps))
          PY
          python -m pip install --disable-pip-version-check --no-cache-dir -r "$RUNNER_TEMP/requirements-ci.txt"

      - name: pytest
        working-directory: backend
        # `python -m pytest` кладёт backend/ в sys.path — устанавливать пакет не
        # нужно. База берётся из временной папки раннера, то есть на каждом
        # прогоне ЧИСТАЯ: ровно тот случай, на котором тесты, зависящие от
        # порядка, и разваливаются (claude/13-workflow.md, «Грабли окружения»).
        run: python -m pytest -q

  frontend:
    name: Сборка фронтенда
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Строгий `npm ci` — в отличие от `npm ci || npm install` в Dockerfile.
      # Разъехавшийся lock-файл должен падать здесь, а не молча собираться в
      # образе с другими версиями.
      - name: npm ci
        working-directory: frontend
        run: npm ci

      # Внутри `build` сначала идёт `tsc --noEmit` — это заодно проверка типов.
      - name: Сборка
        working-directory: frontend
        run: npm run build

  image:
    name: Сборка образа и проверка на уязвимости
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Версию считает эта работа — у неё есть репозиторий. Работа publish берёт
    # готовое число и в pyproject.toml не заглядывает.
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Версия
        id: ver
        run: |
          version=$(python3 -c "import pathlib,tomllib;print(tomllib.loads(pathlib.Path('backend/pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Тег vX.Y.Z обязан совпадать с версией в pyproject: иначе образ с
          # номером 1.2.3 отвечал бы на /api/health чужим номером.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией $version в backend/pyproject.toml"
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Метки OCI: из какого репозитория, коммита и когда собран образ. Они
      # обязаны попасть в слои, то есть проставляются здесь, при сборке, а не
      # при публикации. Имя образа для меток роли не играет.
      - name: Метки
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: anime365-downloader
          # Отсюда metadata-action берёт метку `org.opencontainers.image.version`.
          # Раньше стояло `ci`, и опубликованный образ так и сообщал о себе:
          # версия «ci». Тег для Trivy задаётся отдельно, в шаге сборки.
          tags: type=raw,value=${{ steps.ver.outputs.version }}

      # Ни логина, ни секретов в этой работе нет — и весь код, который
      # выполняется при сборке (npm-хуки зависимостей, pip, RUN из Dockerfile),
      # выполняется именно тут.
      - name: Сборка в архив
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          tags: anime365-downloader:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # `min`, не `max`: max кладёт в кэш все промежуточные слои (под
          # гигабайт), и именно они съедали месячную квоту хранения. С `min`
          # в кэше только слои итогового образа; промежуточные стадии
          # пересобираются, на это уходят минуты — их у бесплатного плана
          # две тысячи в месяц, а хранилища 500 МБ.
          cache-to: type=gha,mode=min
          # Экспортёр docker подписи происхождения не умеет; чем собран образ,
          # удостоверяет подпись cosign в работе publish.
          provenance: false

      - name: Разжать архив для проверки
        run: docker load --input "$RUNNER_TEMP/image.tar"

      # Dockerfile половину своего объёма посвящает выпиливанию пакетов ради
      # чистого отчёта сканера — пусть отчёт и проверяется на каждом прогоне.
      # `ignore-unfixed` намеренно: падаем только там, где есть что чинить.
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: anime365-downloader:ci
          # Без своего кэша: action кладёт базу уязвимостей (82 МБ) под ключ
          # с датой, то есть новую каждый день, плюс бинарник — и они лежат до
          # вытеснения. За неделю это больше, чем весь образ. Скачать базу
          # заново — секунды.
          cache: false
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # На пул-реквесте публиковать нечего, и 180 МБ гонять незачем.
      # Ключ — номер прогона и попытки: архив нужен только следующей работе
      # этого же прогона, и после публикации работа `cleanup` его стирает.
      - name: Передать архив дальше
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image.tar
          key: image-${{ github.run_id }}-${{ github.run_attempt }}

  publish:
    name: Публикация в Docker Hub
    needs: [image]
    # Пул-реквест сюда не попадает никогда — см. комментарий к `on`.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Секрет живёт в окружении, а не в настройках репозитория: окружению можно
    # задать список веток, с которых оно доступно, и ручное подтверждение.
    environment: dockerhub
    permissions:
      contents: read
      id-token: write   # OIDC для keyless-подписи cosign
    steps:
      # ⚠️ У этой работы НЕТ шага checkout, и это главное в ней. Рядом с токеном
      # не оказывается ни одной строки из репозитория: ни Dockerfile, ни
      # package.json с его хуками, ни conftest.py. Образ приезжает готовым
      # архивом, `docker load` его только распаковывает, `docker push`
      # перекладывает слои в реестр. Ничего из образа при этом не исполняется.
      - name: Учётные данные и имя образа
        env:
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          OVERRIDE: ${{ vars.DOCKERHUB_IMAGE }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$USERNAME" || { echo "::error::Не задана переменная DOCKERHUB_USERNAME"; exit 1; }
          test -n "$TOKEN"    || { echo "::error::Не задан секрет DOCKERHUB_TOKEN"; exit 1; }
          # DOCKERHUB_IMAGE нужен, только если публикуем в организацию, а не в
          # личное пространство.
          echo "IMAGE=${OVERRIDE:-$USERNAME/anime365-downloader}" >> "$GITHUB_ENV"
          echo "Публикуем в ${OVERRIDE:-$USERNAME/anime365-downloader}"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/image.tar
          key: image-${{ github.run_id }}-${{ github.run_attempt }}
          # Промах здесь — не «соберём заново», а ошибка: собирать в этой
          # работе нельзя, см. комментарий выше.
          fail-on-cache-miss: true

      - name: Разжать образ
        run: docker load --input "$RUNNER_TEMP/image.tar"

      # Теги:
      #   пуш в main  → 0.1.0-build.<номер прогона>, sha-<коммит>, latest
      #   тег vX.Y.Z  → X.Y.Z, X.Y
      # Первый уникален и растёт монотонно — это и есть «новая версия» на
      # каждый коммит; второй позволяет от образа вернуться к коду.
      - name: Теги
        id: tags
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            list="$VERSION-build.$GITHUB_RUN_NUMBER sha-$(echo "$GITHUB_SHA" | cut -c1-7) latest"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            plain="${GITHUB_REF_NAME#v}"
            list="$plain ${plain%.*}"
          else
            echo "::error::Не понимаю, какие теги ставить для $GITHUB_REF"
            exit 1
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Теги: $list"

      - name: Вход в Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Публикация
        id: push
        env:
          TAGS: ${{ steps.tags.outputs.list }}
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            docker tag anime365-downloader:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          # Слои у всех тегов одни и те же, digest тоже один — берём по первому.
          first="${TAGS%% *}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$first" | cut -d@ -f2)
          test -n "$digest" || { echo "::error::Не смог узнать digest опубликованного образа"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Подпись без ключей: удостоверение выдаёт сам GitHub на время шага,
      # хранить и ротировать нечего. В нём записаны репозиторий, файл workflow и
      # коммит — то есть подпись отвечает и на вопрос «чем собран образ».
      # Проверяется командой из docs/developer.md.
      - name: Подпись образа
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Что опубликовано
        env:
          TAGS: ${{ steps.tags.outputs.list }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Опубликовано"
            echo
            echo '```'
            for tag in $TAGS; do echo "$IMAGE:$tag"; done
            echo "digest: $DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Уборка за прогоном: архив образа из кэша стирается сразу, удалась
  # публикация или нет, — иначе он лежал бы до автоматического вытеснения
  # (семь дней без обращений) и тратил квоту хранения впустую. Отдельная
  # работа, а не шаг в publish: ей нужно право `actions: write`, а работе с
  # токеном Docker Hub лишних прав не даём.
  cleanup:
    name: Уборка кэша
    needs: [publish]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Стереть архив образа из кэша
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: image-${{ github.run_id }}-${{ github.run_attempt }}
        run: gh cache delete "$KEY" -R "$GITHUB_REPOSITORY" || echo "::warning::Запись $KEY в кэше не найдена"
