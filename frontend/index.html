<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anime365 Downloader</title>
    <!-- Иконка вкладки — «365», вырезанное из логотипа скриптом
         scripts/prepare_favicon.py. Логотип целиком сюда не годится: он
         вытянутый, и в 16 пикселях превращается в неразличимую зелёную полосу.
         .ico идёт первым для старых браузеров, .png — для всех остальных. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- Блокирующий и намеренно: тема должна быть известна до первой отрисовки,
         иначе тёмный интерфейс на мгновение мигает белым. Файл крошечный. -->
    <script src="/color-scheme.js"></script>
    <!--
      Заставка до запуска React.

      Без неё экран оставался пустым примерно 390 мс: столько уходит на загрузку
      и разбор бандла, и всё это время не видно ничего — ни фона, ни признака
      работы. Это замерено, а не на глаз.

      Только CSS: скрипты запрещены политикой безопасности (`script-src 'self'`),
      да и незачем — React сам затрёт содержимое `#root`, когда смонтируется,
      так что убирать заставку вручную не нужно.

      Цвета берутся из той же переменной темы, что выставляет color-scheme.js
      выше: иначе заставка мигала бы белым на тёмной теме — ровно то, ради чего
      тот скрипт и сделан блокирующим.
    -->
    <style>
      :root {
        --boot-bg: #fff;
        --boot-ring: rgba(0, 0, 0, 0.16);
        --boot-accent: #4dabf7;
      }
      :root[data-theme='dark'] {
        --boot-bg: #1a1b1e;
        --boot-ring: rgba(255, 255, 255, 0.14);
      }
      body {
        margin: 0;
        background: var(--boot-bg);
      }
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .boot i {
        width: 38px;
        height: 38px;
        border: 3px solid var(--boot-ring);
        border-top-color: var(--boot-accent);
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* Уважаем системную настройку: кому анимация мешает, тот увидит просто
         кольцо. Пустой экран для него лучше всё равно не станет. */
      @media (prefers-reduced-motion: reduce) {
        .boot i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot"><i></i></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
